<svg width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9F8F6"/>
      <stop offset="1" stop-color="#F2EEE8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFAF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2D2D2D" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10V0Z" fill="#7F766A"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #2D2D2D; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #7D7367; letter-spacing: 0.08em; text-transform: uppercase; }
      .section { font: 700 18px Inter, Arial, sans-serif; fill: #2D2D2D; }
      .label { font: 600 15px Inter, Arial, sans-serif; fill: #2D2D2D; }
      .body { font: 400 13px Inter, Arial, sans-serif; fill: #5E564D; }
      .small { font: 500 12px Inter, Arial, sans-serif; fill: #7D7367; }
      .chip { font: 600 11px Inter, Arial, sans-serif; fill: #6A7C63; letter-spacing: 0.08em; text-transform: uppercase; }
      .chip-warm { font: 600 11px Inter, Arial, sans-serif; fill: #8C6B2E; letter-spacing: 0.08em; text-transform: uppercase; }
      .mono { font: 600 12px Inter, Arial, sans-serif; fill: #3E3833; }
      .line { stroke: #7F766A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .line-soft { stroke: #B7AEA3; stroke-width: 2; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="0" fill="url(#bg)"/>

  <text x="72" y="70" class="subtitle">Preventia Cloud Reference</text>
  <text x="72" y="112" class="title">AWS Hosting Architecture</text>
  <text x="72" y="142" class="body">Current live topology for Preventia on App Runner, RDS, Redis, S3, ECR, and Secrets Manager.</text>

  <rect x="72" y="176" width="1456" height="518" rx="30" fill="url(#panel)" stroke="#E5E1DA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="104" y="222" class="section">Runtime / Data Plane</text>
  <text x="104" y="246" class="body">How users reach the platform and how the API reaches stateful AWS services.</text>

  <rect x="104" y="282" width="214" height="180" rx="24" fill="#FCFBF9" stroke="#E5E1DA" stroke-width="1.5"/>
  <rect x="124" y="302" width="92" height="28" rx="14" fill="#EEF5EA"/>
  <text x="143" y="320" class="chip">Entry Point</text>
  <text x="124" y="360" class="label">Users</text>
  <text x="124" y="388" class="body">Patients, caregivers, doctors, pharmacists, and admins</text>
  <text x="124" y="426" class="small">Access via public HTTPS</text>

  <rect x="370" y="282" width="426" height="250" rx="28" fill="#FAF8F4" stroke="#DDD7CF" stroke-width="1.5"/>
  <text x="398" y="320" class="section">Public AWS Edge</text>

  <rect x="398" y="348" width="170" height="140" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="418" y="366" width="100" height="28" rx="14" fill="#F4EFE8"/>
  <text x="437" y="384" class="chip-warm">App Runner</text>
  <text x="418" y="422" class="label">preventia-web</text>
  <text x="418" y="446" class="body">Next.js web client</text>
  <text x="418" y="470" class="small">Public URL / port 3000</text>

  <rect x="594" y="348" width="170" height="140" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="614" y="366" width="100" height="28" rx="14" fill="#F4EFE8"/>
  <text x="633" y="384" class="chip-warm">App Runner</text>
  <text x="614" y="422" class="label">preventia-api</text>
  <text x="614" y="446" class="body">Spring Boot API</text>
  <text x="614" y="470" class="small">Public URL / port 8080</text>

  <rect x="838" y="282" width="658" height="366" rx="28" fill="#F7F4EF" stroke="#DDD7CF" stroke-width="1.5"/>
  <text x="866" y="320" class="section">Default VPC - ap-south-1</text>

  <rect x="866" y="350" width="238" height="128" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <rect x="886" y="368" width="128" height="28" rx="14" fill="#EEF5EA"/>
  <text x="905" y="386" class="chip">Private Network</text>
  <text x="886" y="426" class="label">preventia-vpc-connector</text>
  <text x="886" y="450" class="body">App Runner VPC connector</text>
  <text x="886" y="474" class="small">Routes API dependency traffic into VPC</text>

  <rect x="1128" y="350" width="162" height="128" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="1152" y="390" class="label">Connector Subnets</text>
  <text x="1152" y="420" class="mono">- apprunner-a</text>
  <text x="1152" y="444" class="mono">- apprunner-b</text>
  <text x="1152" y="468" class="mono">- apprunner-c</text>

  <rect x="1312" y="350" width="156" height="128" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="1336" y="390" class="label">Security Groups</text>
  <text x="1336" y="420" class="mono">preventia-apprunner-sg</text>
  <text x="1336" y="448" class="small">egress enabled</text>

  <rect x="866" y="512" width="258" height="108" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="886" y="530" width="78" height="28" rx="14" fill="#F4EFE8"/>
  <text x="910" y="548" class="chip-warm">State</text>
  <text x="886" y="584" class="label">preventia-postgres</text>
  <text x="886" y="608" class="body">RDS PostgreSQL / preventia_db</text>

  <rect x="1150" y="512" width="160" height="108" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1170" y="530" width="78" height="28" rx="14" fill="#F4EFE8"/>
  <text x="1196" y="548" class="chip-warm">Cache</text>
  <text x="1170" y="584" class="label">preventia-redis</text>
  <text x="1170" y="608" class="body">ElastiCache Redis</text>

  <rect x="1336" y="512" width="132" height="108" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="1358" y="558" class="label">DB Access SG</text>
  <text x="1358" y="586" class="mono">preventia-rds-sg</text>
  <text x="1358" y="608" class="small">tcp/5432 from 172.31.0.0/16</text>

  <rect x="1178" y="714" width="350" height="164" rx="28" fill="url(#panel)" stroke="#E5E1DA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1208" y="754" class="section">Storage</text>
  <rect x="1208" y="780" width="286" height="72" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="1232" y="810" class="label">preventia-mvp-prescriptions</text>
  <text x="1232" y="834" class="body">Amazon S3 bucket for prescriptions and uploaded assets</text>

  <path d="M318 372H398" class="line"/>
  <path d="M568 418H594" class="line"/>
  <path d="M679 488V540H866" class="line"/>
  <path d="M996 478V512" class="line"/>
  <path d="M1230 478V512" class="line"/>
  <path d="M679 488V796H1178" class="line"/>

  <text x="476" y="402" class="small">UI traffic</text>
  <text x="586" y="404" class="small">API calls</text>
  <text x="732" y="526" class="small">Private egress</text>
  <text x="792" y="782" class="small">AWS SDK file upload path</text>

  <rect x="72" y="724" width="1070" height="248" rx="30" fill="url(#panel)" stroke="#E5E1DA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="104" y="770" class="section">Deployment / Control Plane</text>
  <text x="104" y="794" class="body">How code, images, and configuration are pushed into the running services.</text>

  <rect x="104" y="830" width="214" height="104" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="128" y="868" class="label">Developer Machine</text>
  <text x="128" y="892" class="body">AWS CLI + Podman</text>
  <text x="128" y="916" class="mono">AWS_PROFILE=preventia</text>

  <rect x="366" y="814" width="180" height="136" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="390" y="850" class="label">Deploy Scripts</text>
  <text x="390" y="878" class="mono">deploy.sh</text>
  <text x="390" y="902" class="mono">04-setup-secrets.sh</text>
  <text x="390" y="926" class="mono">05-setup-apprunner.sh</text>

  <rect x="594" y="830" width="170" height="104" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="618" y="868" class="label">Amazon ECR</text>
  <text x="618" y="892" class="mono">preventia/api</text>
  <text x="618" y="916" class="mono">preventia/web</text>

  <rect x="796" y="830" width="188" height="104" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="820" y="868" class="label">Secrets Manager</text>
  <text x="820" y="892" class="mono">preventia/prod/*</text>
  <text x="820" y="916" class="small">db, redis, jwt, stream, daily, aws-app</text>

  <rect x="1018" y="830" width="186" height="104" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="1042" y="868" class="label">IAM Role</text>
  <text x="1042" y="892" class="mono">AppRunnerECRAccessRole-Preventia</text>

  <path d="M318 882H366" class="line"/>
  <path d="M546 882H594" class="line"/>
  <path d="M546 918H796" class="line"/>
  <path d="M764 882H1018" class="line-soft"/>
  <path d="M1204 882H1336V880" class="line-soft"/>

  <text x="641" y="862" class="small">build + push images</text>
  <text x="643" y="905" class="small">write config and secrets</text>
  <text x="850" y="862" class="small">image pull permission for App Runner</text>

  <rect x="1336" y="814" width="160" height="136" rx="22" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1.5"/>
  <text x="1360" y="850" class="label">Runtime IAM User</text>
  <text x="1360" y="878" class="mono">preventia-app</text>
  <text x="1360" y="904" class="small">S3 access key injected into API env</text>

  <rect x="104" y="980" width="1392" height="24" rx="12" fill="#F1ECE5"/>
  <text x="120" y="996" class="small">Current live stack does not yet include CloudFront, Route53, WAF, or a dedicated production VPC.</text>
</svg>
