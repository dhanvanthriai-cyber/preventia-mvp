spring:
  application:
    name: preventia-mvp

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:preventia_db}
    username: ${DB_USER:dhan_dev}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false     # Strict: no baseline creep in prod
    repair-on-migrate: true        # Auto-repair checksum mismatches on startup
    validate-on-migrate: false     # Skip validation — checksums are managed via repair

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}  # uncomment when auth is enabled

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}          # Injected from AWS Secrets Manager (ap-south-1)
    expiration-ms: 86400000        # 24 hours
  admin:
    bootstrap-secret: ${APP_ADMIN_BOOTSTRAP_SECRET:}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never          # Never expose DB details publicly
  health:
    redis:
      enabled: false               # Exclude Redis from health — prevents DOWN status on startup
    diskspace:
      enabled: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.preventia: DEBUG
    com.preventia.shared.security: DEBUG
    org.springframework.security: DEBUG

stripe:
  api:
    key: ${STRIPE_API_KEY:STUB}

razorpay:
  api:
    key: ${RAZORPAY_API_KEY:STUB}
    secret: ${RAZORPAY_API_SECRET:STUB}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:STUB}

stream:
  api-key: ${STREAM_API_KEY:STUB_KEY}
  api-secret: ${STREAM_API_SECRET:STUB_SECRET}

daily:
  api-key: ${DAILY_API_KEY}                   # Daily.co REST API key — never log or expose
  webhook-secret: ${DAILY_WEBHOOK_SECRET}     # HMAC-SHA256 shared secret for webhook validation

aws:
  region: ${AWS_REGION:ap-south-1}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket-name: ${S3_BUCKET_NAME:preventia-mvp-prescriptions}
