spring:
  application:
    name: dhanvanthri-mvp

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:dhanvanthri}
    username: ${DB_USER:dhanvanthri}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false     # Strict: no baseline creep in prod

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}          # Injected from AWS Secrets Manager (ap-south-1)
    expiration-ms: 86400000        # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never          # Never expose DB details publicly

logging:
  level:
    com.dhanvanthri: INFO
    org.springframework.security: WARN
