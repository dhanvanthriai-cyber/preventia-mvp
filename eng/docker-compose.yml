# ============================================================
# Project Preventia — Local Development Stack
# macOS — Podman Desktop (podman compose)
#
# Usage:
#   cp .env.example .env          # fill in secrets (already done)
#   podman machine start          # start Podman VM (once per reboot)
#   podman compose up --build -d  # build image + start all services
#   podman compose logs -f app    # follow Spring Boot logs
#   podman compose down           # stop all services
#   podman compose down -v        # stop + wipe DB volumes (clean slate)
#
# Memory budget (macOS Podman VM default 2 GB):
#   postgres  512 MB
#   redis     256 MB
#   app      1024 MB
#   ─────────────────
#   total   ~1792 MB
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 16 — Primary relational store (PHI)
  # ----------------------------------------------------------
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: preventia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-preventia_db}
      POSTGRES_USER:     dhan_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhan_dev -d ${DB_NAME:-preventia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------
  # Redis 7 — Session cache + rate-limit counters
  # ----------------------------------------------------------
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: preventia-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Spring Boot App — Preventia monolith
  # Built via multi-stage Dockerfile (Maven → JRE)
  # ----------------------------------------------------------
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        # Pass CACHE_BUST=$(date +%s) on the CLI to force src recompile:
        # podman compose build --build-arg CACHE_BUST=$(date +%s) app
        CACHE_BUST: ${CACHE_BUST:-1}
    container_name: preventia-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1024m
    environment:
      # --- JVM tuning ---
      JAVA_OPTS: "-Xms256m -Xmx768m"
      # --- Database ---
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${DB_NAME:-preventia_db}
      SPRING_DATASOURCE_USERNAME: dhan_dev
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Redis ---
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # --- App secrets ---
      JWT_SECRET:         ${JWT_SECRET}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS}
      # --- Flyway (auto-runs migrations on startup) ---
      SPRING_FLYWAY_ENABLED: "true"
      # --- Daily.co ---
      DAILY_API_KEY:        ${DAILY_API_KEY:-STUB}
      DAILY_WEBHOOK_SECRET: ${DAILY_WEBHOOK_SECRET:-STUB}
      # --- AWS / S3 ---
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:-STUB}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-STUB}
      AWS_REGION:            ${AWS_REGION:-ap-south-1}
      S3_BUCKET_NAME:        ${S3_BUCKET_NAME:-preventia-mvp-prescriptions}
      # --- Stream Chat ---
      STREAM_API_KEY:    ${STREAM_API_KEY:-STUB_KEY}
      STREAM_API_SECRET: ${STREAM_API_SECRET:-STUB_SECRET}
      # --- Payment gateways ---
      STRIPE_API_KEY:         ${STRIPE_API_KEY:-STUB}
      RAZORPAY_API_KEY:       ${RAZORPAY_API_KEY:-STUB}
      RAZORPAY_API_SECRET:    ${RAZORPAY_API_SECRET:-STUB}
      # --- Admin bootstrap ---
      APP_ADMIN_BOOTSTRAP_SECRET: ${APP_ADMIN_BOOTSTRAP_SECRET:-}
      # --- Logging ---
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}

# ----------------------------------------------------------
# Named Volumes
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
