spring:
  application:
    name: dhanvanthri-mvp

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:dhanvanthri_db}
    username: ${DB_USER:dhan_dev}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false     # Strict: no baseline creep in prod

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}  # uncomment when auth is enabled

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}          # Injected from AWS Secrets Manager (ap-south-1)
    expiration-ms: 86400000        # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never          # Never expose DB details publicly

stripe:
  api:
    key: ${STRIPE_API_KEY:STUB}

razorpay:
  api:
    key: ${RAZORPAY_API_KEY:STUB}
    secret: ${RAZORPAY_API_SECRET:STUB}

logging:
  level:
    com.dhanvanthri: INFO
    org.springframework.security: WARN

daily:
  api-key: ${DAILY_API_KEY}                   # Daily.co REST API key — never log or expose
  webhook-secret: ${DAILY_WEBHOOK_SECRET}     # HMAC-SHA256 shared secret for webhook validation

aws:
  region: ${AWS_REGION:ap-south-1}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket-name: ${S3_BUCKET_NAME:dhanvanthri-mvp-prescriptions}
